name: Build Heedar TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip if present
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Unzipping $f..."
              unzip -o "$f"
            fi
          done
          
          if [ ! -f "gradlew" ]; then
            GRADLEW_DIR=$(find . -mindepth 2 -name "gradlew" -printf '%h\n' | head -n 1)
            if [ -n "$GRADLEW_DIR" ]; then
              echo "Moving files from $GRADLEW_DIR to root..."
              shopt -s dotglob
              mv "$GRADLEW_DIR"/* .
            fi
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            mkdir -p app/src/main
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Heedar TV"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".player.PlayerActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize"
                      android:exported="false"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen" />
              </application>
          </manifest>
          EOF
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heedar-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

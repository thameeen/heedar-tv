name: Build Heedar TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          if [ -d "Heedar-TV-independent" ]; then
            cp -r Heedar-TV-independent/* . || true
          fi

          SRC_DIR=$(find . -type d -name "src" | head -n 1)
          if [ -n "$SRC_DIR" ] && [ "$SRC_DIR" != "./app/src" ]; then
            mkdir -p app
            cp -r "$SRC_DIR" app/ || true
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "Heedar-TV-Independent"' >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo 'plugins { id("com.android.application") version "8.7.3" apply false; id("org.jetbrains.kotlin.android") version "2.0.21" apply false }' > build.gradle.kts
          fi

          if [ ! -f "gradle.properties" ]; then
            echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' > gradle.properties
            echo 'org.gradle.parallel=true' >> gradle.properties
            echo 'android.useAndroidX=true' >> gradle.properties
            echo 'kotlin.code.style=official' >> gradle.properties
          fi

          mkdir -p app
          if [ ! -f "app/build.gradle.kts" ]; then
            echo 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }' > app/build.gradle.kts
            echo 'android { namespace = "com.heedar.tv"; compileSdk = 35; defaultConfig { applicationId = "com.heedar.tv"; minSdk = 23; targetSdk = 35; versionCode = 10; versionName = "0.10.0-independent" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }' >> app/build.gradle.kts
            echo 'dependencies { implementation("androidx.media3:media3-exoplayer:1.5.0"); implementation("androidx.media3:media3-exoplayer-hls:1.5.0"); implementation("androidx.media3:media3-ui:1.5.0") }' >> app/build.gradle.kts
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            mkdir -p app/src/main
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-feature android:name="android.software.leanback" android:required="false"/><uses-feature android:name="android.hardware.touchscreen" android:required="false"/><application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="Heedar TV" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustPan"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity><activity android:name=".player.PlayerActivity" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize" android:exported="false" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"/></application></manifest>' > app/src/main/AndroidManifest.xml
          fi

          python3 -c "
          import os
          target = 'app/src/main/java/com/heedar/tv/settings/AppPreferences.kt'
          os.makedirs(os.path.dirname(target), exist_ok=True)
          if not os.path.exists(target):
              with open(target, 'w') as f:
                  f.write('''package com.heedar.tv.settings

          import android.content.Context
          import android.graphics.Color

          class AppPreferences(context: Context) {
              private val values = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              var theme: String
                  get() = values.getString(KEY_THEME, THEME_OCEAN) ?: THEME_OCEAN
                  set(value) { values.edit().putString(KEY_THEME, value.takeIf { it in THEMES } ?: THEME_OCEAN).apply() }

              var density: String
                  get() = values.getString(KEY_DENSITY, DENSITY_COMFORTABLE) ?: DENSITY_COMFORTABLE
                  set(value) { values.edit().putString(KEY_DENSITY, value.takeIf { it in DENSITIES } ?: DENSITY_COMFORTABLE).apply() }

              var videoScale: String
                  get() = values.getString(KEY_VIDEO_SCALE, SCALE_FIT) ?: SCALE_FIT
                  set(value) { values.edit().putString(KEY_VIDEO_SCALE, value.takeIf { it in VIDEO_SCALES } ?: SCALE_FIT).apply() }

              var autoPlay: Boolean
                  get() = values.getBoolean(KEY_AUTOPLAY, true)
                  set(value) { values.edit().putBoolean(KEY_AUTOPLAY, value).apply() }

              var keepScreenOn: Boolean
                  get() = values.getBoolean(KEY_KEEP_SCREEN_ON, true)
                  set(value) { values.edit().putBoolean(KEY_KEEP_SCREEN_ON, value).apply() }

              var controlsTimeoutMs: Int
                  get() = values.getInt(KEY_CONTROLS_TIMEOUT, 5_000).takeIf { it in CONTROL_TIMEOUTS } ?: 5_000
                  set(value) { values.edit().putInt(KEY_CONTROLS_TIMEOUT, value.takeIf { it in CONTROL_TIMEOUTS } ?: 5_000).apply() }

              val densityScale: Float
                  get() = when (density) {
                      DENSITY_COMPACT -> 0.88f
                      DENSITY_LARGE -> 1.15f
                      else -> 1.0f
                  }

              val backgroundColor: Int
                  get() = when (theme) {
                      THEME_GRAPHITE -> Color.rgb(15, 18, 24)
                      THEME_PURPLE -> Color.rgb(16, 12, 28)
                      else -> Color.rgb(8, 13, 26)
                  }

              val surfaceColor: Int
                  get() = when (theme) {
                      THEME_GRAPHITE -> Color.rgb(31, 37, 47)
                      THEME_PURPLE -> Color.rgb(37, 27, 58)
                      else -> Color.rgb(24, 34, 54)
                  }

              val buttonColor: Int
                  get() = when (theme) {
                      THEME_GRAPHITE -> Color.rgb(43, 52, 65)
                      THEME_PURPLE -> Color.rgb(54, 39, 82)
                      else -> Color.rgb(31, 51, 79)
                  }

              val accentColor: Int
                  get() = when (theme) {
                      THEME_GRAPHITE -> Color.rgb(125, 211, 252)
                      THEME_PURPLE -> Color.rgb(195, 146, 255)
                      else -> Color.rgb(99, 216, 255)
                  }

              fun themeLabel(): String = when (theme) {
                  THEME_GRAPHITE -> \"رمادي داكن\"
                  THEME_PURPLE -> \"بنفسجي ليلي\"
                  else -> \"أزرق محيطي\"
              }

              fun densityLabel(): String = when (density) {
                  DENSITY_COMPACT -> \"مضغوط\"
                  DENSITY_LARGE -> \"كبير\"
                  else -> \"مريح\"
              }

              fun videoScaleLabel(): String = when (videoScale) {
                  SCALE_CROP -> \"ملء مع قص الأطراف\"
                  SCALE_STRETCH -> \"تمديد لملء الشاشة\"
                  else -> \"احتواء كامل الصورة\"
              }

              fun controlsTimeoutLabel(): String = when (controlsTimeoutMs) {
                  3_000 -> \"3 ثوانٍ\"
                  8_000 -> \"8 ثوانٍ\"
                  else -> \"5 ثوانٍ\"
              }

              companion object {
                  const val THEME_OCEAN = \"ocean\"
                  const val THEME_GRAPHITE = \"graphite\"
                  const val THEME_PURPLE = \"purple\"
                  const val DENSITY_COMPACT = \"compact\"
                  const val DENSITY_COMFORTABLE = \"comfortable\"
                  const val DENSITY_LARGE = \"large\"
                  const val SCALE_FIT = \"fit\"
                  const val SCALE_CROP = \"crop\"
                  const val SCALE_STRETCH = \"stretch\"
                  val THEMES = setOf(THEME_OCEAN, THEME_GRAPHITE, THEME_PURPLE)
                  val DENSITIES = setOf(DENSITY_COMPACT, DENSITY_COMFORTABLE, DENSITY_LARGE)
                  val VIDEO_SCALES = setOf(SCALE_FIT, SCALE_CROP, SCALE_STRETCH)
                  val CONTROL_TIMEOUTS = setOf(3_000, 5_000, 8_000)

                  private const val PREFS_NAME = \"heedar_user_preferences_v1\"
                  private const val KEY_THEME = \"theme\"
                  private const val KEY_DENSITY = \"density\"
                  private const val KEY_VIDEO_SCALE = \"video_scale\"
                  private const val KEY_AUTOPLAY = \"player_autoplay\"
                  private const val KEY_KEEP_SCREEN_ON = \"player_keep_screen_on\"
                  private const val KEY_CONTROLS_TIMEOUT = \"player_controls_timeout_ms\"
              }
          }
          ''')
          "

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Heedar-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

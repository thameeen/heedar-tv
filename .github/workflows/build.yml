name: Build Heedar TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          if [ -d "Heedar-TV-independent" ]; then
            cp -r Heedar-TV-independent/* . || true
          fi

          SRC_DIR=$(find . -type d -name "src" | head -n 1)
          if [ -n "$SRC_DIR" ] && [ "$SRC_DIR" != "./app/src" ]; then
            mkdir -p app
            cp -r "$SRC_DIR" app/ || true
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "Heedar-TV-Independent"' >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo 'plugins { id("com.android.application") version "8.7.3" apply false; id("org.jetbrains.kotlin.android") version "2.0.21" apply false }' > build.gradle.kts
          fi

          if [ ! -f "gradle.properties" ]; then
            echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' > gradle.properties
            echo 'org.gradle.parallel=true' >> gradle.properties
            echo 'android.useAndroidX=true' >> gradle.properties
            echo 'kotlin.code.style=official' >> gradle.properties
          fi

          mkdir -p app
          if [ ! -f "app/build.gradle.kts" ]; then
            echo 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }' > app/build.gradle.kts
            echo 'android { namespace = "com.heedar.tv"; compileSdk = 35; defaultConfig { applicationId = "com.heedar.tv"; minSdk = 23; targetSdk = 35; versionCode = 10; versionName = "0.10.0-independent" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }' >> app/build.gradle.kts
            echo 'dependencies { implementation("androidx.media3:media3-exoplayer:1.5.0"); implementation("androidx.media3:media3-exoplayer-hls:1.5.0"); implementation("androidx.media3:media3-ui:1.5.0") }' >> app/build.gradle.kts
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            mkdir -p app/src/main
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-feature android:name="android.software.leanback" android:required="false"/><uses-feature android:name="android.hardware.touchscreen" android:required="false"/><application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="Heedar TV" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustPan"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity><activity android:name=".player.PlayerActivity" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize" android:exported="false" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"/></application></manifest>' > app/src/main/AndroidManifest.xml
          fi

          python3 -c "
          import os

          # 1. كتابة AppPreferences.kt
          p1 = 'app/src/main/java/com/heedar/tv/settings/AppPreferences.kt'
          os.makedirs(os.path.dirname(p1), exist_ok=True)
          with open(p1, 'w', encoding='utf-8') as f:
              f.write('''package com.heedar.tv.settings
          import android.content.Context
          import android.graphics.Color
          class AppPreferences(context: Context) {
              private val values = context.getSharedPreferences(\"heedar_prefs\", Context.MODE_PRIVATE)
              var theme: String get() = values.getString(\"theme\", \"ocean\") ?: \"ocean\"; set(v) { values.edit().putString(\"theme\", v).apply() }
              var density: String get() = values.getString(\"density\", \"comfortable\") ?: \"comfortable\"; set(v) { values.edit().putString(\"density\", v).apply() }
              var videoScale: String get() = values.getString(\"scale\", \"fit\") ?: \"fit\"; set(v) { values.edit().putString(\"scale\", v).apply() }
              var autoPlay: Boolean get() = values.getBoolean(\"autoplay\", true); set(v) { values.edit().putBoolean(\"autoplay\", v).apply() }
              var keepScreenOn: Boolean get() = values.getBoolean(\"keep_on\", true); set(v) { values.edit().putBoolean(\"keep_on\", v).apply() }
              var controlsTimeoutMs: Int get() = values.getInt(\"timeout\", 5000); set(v) { values.edit().putInt(\"timeout\", v).apply() }
              val densityScale: Float get() = if (density == \"compact\") 0.88f else if (density == \"large\") 1.15f else 1.0f
              val backgroundColor: Int get() = Color.rgb(8, 13, 26)
              val surfaceColor: Int get() = Color.rgb(24, 34, 54)
              val buttonColor: Int get() = Color.rgb(31, 51, 79)
              val accentColor: Int get() = Color.rgb(99, 216, 255)
              fun themeLabel() = \"أزرق محيطي\"
              fun densityLabel() = \"مريح\"
              fun videoScaleLabel() = \"احتواء كامل الصورة\"
              fun controlsTimeoutLabel() = \"5 ثوانٍ\"
              companion object {
                  const val THEME_OCEAN = \"ocean\"; const val THEME_GRAPHITE = \"graphite\"; const val THEME_PURPLE = \"purple\"
                  const val DENSITY_COMPACT = \"compact\"; const val DENSITY_COMFORTABLE = \"comfortable\"; const val DENSITY_LARGE = \"large\"
                  const val SCALE_FIT = \"fit\"; const val SCALE_CROP = \"crop\"; const val SCALE_STRETCH = \"stretch\"
              }
          }''')

          # 2. كتابة ProviderCredentials.kt
          p2 = 'app/src/main/java/com/heedar/tv/data/ProviderCredentials.kt'
          os.makedirs(os.path.dirname(p2), exist_ok=True)
          with open(p2, 'w', encoding='utf-8') as f:
              f.write('''package com.heedar.tv.data
          data class ProviderCredentials(val serverUrl: String, val username: String, val password: String)
          data class XtreamServerProfile(val id: String, val displayName: String, val credentials: ProviderCredentials)
          data class XtreamCategory(val categoryId: String, val name: String)
          data class LiveChannel(val streamId: String, val name: String, val iconUrl: String?, val categoryId: String?)
          data class VodMovie(val streamId: String, val name: String, val coverUrl: String?, val categoryId: String?, val containerExtension: String, val rating: String?)
          data class SeriesItem(val seriesId: String, val name: String, val coverUrl: String?, val categoryId: String?)
          data class SeriesEpisode(val episodeId: String, val name: String, val seasonNumber: Int, val episodeNumber: Int, val containerExtension: String)
          data class EpgProgram(val title: String, val description: String, val startTimeMillis: Long?, val endTimeMillis: Long?)''')

          # 3. كتابة MemoryContentCache.kt
          p3 = 'app/src/main/java/com/heedar/tv/data/MemoryContentCache.kt'
          os.makedirs(os.path.dirname(p3), exist_ok=True)
          with open(p3, 'w', encoding='utf-8') as f:
              f.write('''package com.heedar.tv.data
          import java.security.MessageDigest
          import java.util.LinkedHashMap
          object MemoryContentCache {
              private data class Entry(val value: Any, val weightBytes: Int, val expiresAtMillis: Long)
              private const val MAX_BYTES = 8 * 1024 * 1024
              private val entries = LinkedHashMap<String, Entry>(32, 0.75f, true)
              private var currentBytes = 0
              @Synchronized @Suppress(\"UNCHECKED_CAST\")
              fun <T : Any> get(key: String): T? {
                  val e = entries[key] ?: return null
                  if (e.expiresAtMillis <= System.currentTimeMillis()) { entries.remove(key); currentBytes -= e.weightBytes; return null }
                  return e.value as? T
              }
              @Synchronized fun put(key: String, value: Any, weightBytes: Int, ttlMillis: Long = 300000L) {
                  if (weightBytes <= 0 || weightBytes > MAX_BYTES) return
                  entries.remove(key)?.let { currentBytes -= it.weightBytes }
                  entries[key] = Entry(value, weightBytes, System.currentTimeMillis() + ttlMillis)
                  currentBytes += weightBytes
                  val it = entries.entries.iterator()
                  while (currentBytes > MAX_BYTES && it.hasNext()) { currentBytes -= it.next().value.weightBytes; it.remove() }
              }
              @Synchronized fun clear() { entries.clear(); currentBytes = 0 }
              fun fingerprint(ns: String, parts: List<String>): String {
                  val md = MessageDigest.getInstance(\"SHA-256\")
                  fun add(s: String) { val b = s.toByteArray(); md.update(b) }
                  add(ns); parts.forEach(::add)
                  return md.digest().joinToString(\"\") { \"%02x\".format(it) }
              }
              fun approximateStringListBytes(items: List<String>): Int = items.sumOf { it.length * 2 + 40 } + 128
          }''')
          "

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Heedar-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

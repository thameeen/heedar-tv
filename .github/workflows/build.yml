name: Build Heedar TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip if present
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Unzipping $f..."
              unzip -o "$f"
            fi
          done
          
          if [ ! -f "gradlew" ]; then
            GRADLEW_DIR=$(find . -mindepth 2 -name "gradlew" -printf '%h\n' | head -n 1)
            if [ -n "$GRADLEW_DIR" ]; then
              echo "Moving files from $GRADLEW_DIR to root..."
              shopt -s dotglob
              mv "$GRADLEW_DIR"/* .
            fi
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heedar-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
